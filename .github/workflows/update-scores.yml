name: Update Match Scores

on:
  schedule:
    # Every 30 minutes during peak match hours (noon–midnight UTC = 8am–8pm ET)
    - cron: '*/30 12-23 * * *'
    # Every hour outside peak hours
    - cron: '0 0-11 * * *'
  workflow_dispatch: # Allows manual triggering from the Actions tab

jobs:
  update-scores:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch and update scores
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: python scripts/update_scores.py

      - name: Commit and push if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add matches.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update match scores [automated]" && git push)

